function deleteCookie(cookiename) {
 document.cookie = cookiename + "=leeg;expires=Thu, 1 Jan 1970 00:00:00 GMT;path=/"
}

function setCookie(cookiename, cvalue) {
 document.cookie = cookiename + "=" + cvalue + ";expires=Mon, 18 Jan 2038 00:00:00 GMT;path=/"
}

function getCookie(cookiename) {
 var search = cookiename + "="
 if (document.cookie.length > 0) {
  var offset = document.cookie.indexOf(search) 
  if (offset != -1) {
   offset += search.length 
   var end = document.cookie.indexOf(";", offset)
   if (end == -1) end = document.cookie.length 
   return unescape(document.cookie.substring(offset, end))
  }
 }
 return ""
}

function random() {
 var ts = new Date()
 ts = ts.getTime()
 if (ts < 10000) {
  ts = "0000" + ts
 }
 else {
  ts = "" + ts
 }
 var rd = ts.substring(ts.length - 3,ts.length - 1)
 if (rd == "00") {
  rd = ts.substring(ts.length - 5,ts.length - 3)
 }
 rd = parseInt(rd,10)
 return rd
}

function unixtijd() {
 var tijd = new Date()
 tijd = tijd.getTime()
 if (tijd < 10000) {
  tijd = "0000" + tijd
 }
 else {
  tijd = "" + tijd
 }

function string_splitsen(scheidingsteken, doelstring) {
 var resultaat = ""
 var arrayitem = 0
 var lijst = new Array()
 doelstring = "" + doelstring
 for (var i=0; i < doelstring.length + 1; i++) {
  var teken=doelstring.substring(i, i+1)
  if (teken == scheidingsteken || i == doelstring.length) {
   lijst[arrayitem] = resultaat
   arrayitem = arrayitem + 1
   resultaat = ""
  }
  else {
   resultaat = resultaat + teken
  }
 }
 return lijst
}
