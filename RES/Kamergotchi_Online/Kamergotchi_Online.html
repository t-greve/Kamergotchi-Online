 <script type="text/javascript" language="JavaScript1.1">
 function opstartfunc() {
  configfunc()
  document.title = branding_titel

 //Hier wordt gekeken welke shell is ingesteld voor Kamergotchi Online en wordt de juiste shell
 //in het iframe geladen met een script in het configuratiebestand.

  var hoogte = document.getElementById("body").scrollHeight + "px"
  document.getElementById("body").style.height = hoogte
 }

 var instellingen = getCookie("kgo_instellingen")
 if (instellingen) {
  var versiedomlezen = instellingen.substring(0,6)
  if (versiedomlezen == "KGO213") {
   instellingen = instellingen.split(">")
   instellingensaveversie = instellingen[0]
   copyrightgezien = instellingen[1]
   spelmodule = instellingen [2]
   geluid = instellingen[3]
   donkeremodus = instellingen[4]
   gekleurdetekst = instellingen[5]
   shell = instellingen[6]
   protocol = instellingen[7]
   instellingen = instellingensaveversie + ">" + copyrightgezien +  ">" + spelmodule + ">" + geluid + ">" + donkeremodus + ">" + gekleurdetekst + ">" + shell + ">" + "http"
   setCookie("kgo_instellingen", instellingen, 365)
  }
  else if (versiedomlezen == "KG212>") {
   instellingen = instellingen.split(">")
   instellingensaveversie = "KGO213"
   copyrightgezien = instellingen[1]
   spelmodule = instellingen [3]
   geluid = instellingen[4]
   donkeremodus = instellingen[5]
   gekleurdetekst = instellingen[6]
   shell = parseInt(instellingen[7]) * 3
   protocol = instellingen[8]
   instellingen = instellingensaveversie + ">" + copyrightgezien +  ">" + spelmodule + ">" + geluid + ">" + donkeremodus + ">" + gekleurdetekst + ">" + shell + ">" + "http"
   setCookie("kgo_instellingen", instellingen, 365)
  }
  else if (versiedomlezen == "KG210>") {
   instellingen = instellingen.split(">")
   instellingensaveversie = "KGO213"
   copyrightgezien = instellingen[1]
   spelmodule = instellingen [3]
   geluid = instellingen[4]
   donkeremodus = instellingen[5]
   gekleurdetekst = instellingen[6]
   shell = iparseInt(instellingen[7]) * 3
   protocol = "http"
   instellingen = instellingensaveversie + ">" + copyrightgezien +  ">" + spelmodule + ">" + geluid + ">" + donkeremodus + ">" + gekleurdetekst + ">" + shell + ">" + protocol
   setCookie("kgo_instellingen", instellingen, 365)
  }
  else if (versiedomlezen == "KG209>") {
   document.getElementById("instellingencookie-div").innerHTML=instellingen
   instellingen = instellingen.split(">")
   instellingensaveversie = instellingen[0]
   copyrightgezien = instellingen[1]
   spelmodule = instellingen [3]
   geluid = instellingen[4]
   donkeremodus = instellingen[5]
   gekleurdetekst = instellingen[6]
   instellingensaveversie = "KGO213"
   shell = 0
   protocol = "http"
   instellingen = instellingensaveversie + ">" + copyrightgezien +  ">" + spelmodule + ">" + geluid + ">" + donkeremodus + ">" + gekleurdetekst + ">" + shell + ">" + protocol
   setCookie("kgo_instellingen", instellingen, 365)
  }
  else {
   instellingensaveversie = "KGO213"
   copyrightgezien = "leeg"
   spelmodule = "leeg"
   geluid = "leeg"
   donkeremodus = "leeg"
   gekleurdetekst = "leeg"
   shell = 0
   protocol = "http"
   instellingen = instellingensaveversie + ">" + copyrightgezien +  ">" + spelmodule + ">" + geluid + ">" + donkeremodus + ">" + gekleurdetekst + ">" + shell + ">" + protocol
   setCookie("kgo_instellingen", instellingen, 365)
  }
 }
 else {
  instellingensaveversie = "KGO213"
  copyrightgezien = "leeg"
  spelmodule = "leeg"
  geluid = "leeg"
  donkeremodus = "leeg"
  gekleurdetekst = "leeg"
  shell = 0
  protocol = "http"
  instellingen = instellingensaveversie + ">" + copyrightgezien +  ">" + spelmodule + ">" + geluid + ">" + donkeremodus + ">" + gekleurdetekst + ">" + shell + ">" + protocol
  setCookie("kgo_instellingen", instellingen, 365)
 }
 if (window.location.protocol == "https:") {
  protocol = "https"
  https2test()
 }
 else if (protocol == "https") {
  try {
   var img = new Image()
   img.onload = function() {
    protocol = "https"
    https2test()
   }
   img.onerror = function() {
    protocol = "http"
    https2test()
   }
   var adres = window.location.hostname + window.location.pathname
   adres = adres.split("/")
   adres[adres.length - 1] = "Kern/HTTPSTest/HTTPSTest.png"
   adres = adres.join("/")
   img.src = "https://" + adres
  }
  catch (error) {
   protocol = "http"
   https2test()
  }
 }
 else {
  protocol = "http"
  https2test()
 }
}

function kgo_Achtergrondkleurbijwerken() {
 if(window.frames["spelframe"].document.body) {
  var kleur = window.frames["spelframe"].document.body.style.backgroundColor
  document.getElementById("body").bgcolor = kleur
  document.getElementById("body").style.backgroundColor = kleur
 }
}

function https2test() {
 instellingen = instellingensaveversie + ">" + copyrightgezien +  ">" + spelmodule + ">" + geluid + ">" + donkeremodus + ">" + gekleurdetekst + ">" + shell + ">" + protocol
 setCookie("kgo_instellingen", instellingen, 365)
 document.getElementById("spelframe").style.width = "100%"
 if (window.location.protocol != "https:" && protocol == "https") {
  window.location.href = "https://" + window.location.hostname + window.location.pathname + window.location.search
 }
 else {
  if (copyrightgezien == "gelezen" && shell % 3 == 0 && shell < shellsarray.length) {
   if ((/Opera/i.test(navigator.userAgent) && /Nintendo/i.test(navigator.userAgent) && /DS/i.test(navigator.userAgent)) || (/MSIE 6.0; Nitro/i.test(navigator.userAgent) && /Opera 8./i.test(navigator.userAgent))) {
    window.location.href = shellsarray[parseInt(shell)+2] + location.search
   }
   else {
    document.getElementById("spelframe").src = shellsarray[parseInt(shell)+2] + location.search
   }
  }
  else {
   if ((/Opera/i.test(navigator.userAgent) && /Nintendo/i.test(navigator.userAgent) && /DS/i.test(navigator.userAgent)) || (/MSIE 6.0; Nitro/i.test(navigator.userAgent) && /Opera 8./i.test(navigator.userAgent))) {
    window.location.href = "Frames/Begin.html" + location.search
   }
   else {
    document.getElementById("spelframe").src = "Frames/Begin.html" + location.search
   }
  }
 }
}
