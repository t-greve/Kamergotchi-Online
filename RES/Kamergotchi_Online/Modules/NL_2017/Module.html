//----------Wanneer zijn de verkiezingen----------\\

function NL_2017_datum(dag, maand, jaar) {
 if (jaar < 2017) {
  var random = Math.floor(Math.random() * 25) + 1
  if (random == 24) {
   window.parent.tekstfunc("verkiezingen", "spel")
  }
 }

  var random = Math.floor(Math.random() * 15) + 1

   window.parent.tekstfunc("verkiezingenditjaar", "spel")
  }
 }

  var random = Math.floor(Math.random() * 10) + 1
  if (random == 9) {
   window.parent.tekstfunc("verkiezingenvolgendeweek", "spel")
  }
 }

 if (jaar == 2017 && maand == 2 && dag > 12 && dag < 15) {
  var random = Math.floor(Math.random() * 5) + 1
  if (random == 4) {
   window.parent.tekstfunc("verkiezingendezeweek", "spel")

//----------Berekening van de datum van Pasen in een jaar----------\\

function NL_2017_pasen(Y) {
 var C = Math.floor(Y/100)
 var N = Y - 19*Math.floor(Y/19)
 var K = Math.floor((C - 17)/25)
 var I = C - Math.floor(C/4) - Math.floor((C - K)/3) + 19*N + 15
 I = I - 30*Math.floor((I/30))
 I = I - Math.floor(I/28)*(1 - Math.floor(I/28)*Math.floor(29/(I + 1))*Math.floor((21 - N)/11))
 var J = Y + Math.floor(Y/4) + I + 2 - C + Math.floor(C/4)
 J = J - 7*Math.floor(J/7)
 var L = I - J
 var M = 3 + Math.floor((L + 40)/44)
 var D = L + 28 - 31*Math.floor(M/4)
 M = M - 1
 var paasstring = D + '>' + M
 var paasarray = paasstring.split('>')
 return paasarray
}
