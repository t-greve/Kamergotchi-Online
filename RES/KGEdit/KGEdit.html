function invulfunc(variabele, waarde) {
 if (!waarde && waarde != "0") {
  document.getElementById(variabele).value="Geen"
  document.getElementById(variabele).disabled=true
 }
 else if (waarde == "[object HTMLInputElement]") {
  document.getElementById(variabele).value="Geen"
  document.getElementById(variabele).disabled=true
 }
 else {
  document.getElementById(variabele).value=waarde
  if (variabele.indexOf("versie") == -1) {
   document.getElementById(variabele).disabled=false
  }
 }
}

function opslaanfunc() {
 var cookietype = document.getElementById("Output").value
 var saveversie = document.getElementById("saveversie").value
 var cookiestring = maakcookiestring(cookietype, saveversie)
 if (cookietype.indexOf("kgb_speldata") !== -1) {
  downloadfunc(cookiestring)
 }
 else {
  setCookie(cookietype, cookiestring, 365)
 }
 laadfunc()
}

function laadfunc() {
 document.getElementById("resultaten").style.display = "none"
 var cookietype = document.getElementById("Input").value
 document.getElementById("Output").value = cookietype
 if (cookietype.indexOf("kgb_speldata") !== -1) {
  if (kgbatch_tijdelijk == "leeg") {
   document.getElementById("uploaden").click()
  }
  else {
    var cookieinhoud = kgbatch_tijdelijk
    parseCookie(cookietype, cookieinhoud)
  }
 }
 else {
  var cookieinhoud=getCookie(cookietype)
  parseCookie(cookietype, cookieinhoud)
 }
}

function verwijderfunc(){
  var cookie = document.getElementById("Input").value
  deleteCookie(cookie)
  laadfunc()
}

function uploadfunc(){
 var fileToLoad = document.getElementById("uploaden").files[0]
 var fileReader = new FileReader()
 fileReader.onload = function(fileLoadedEvent){
  var array = fileLoadedEvent.target.result
  if (!array) {
   array = " "
  }
  var savetype = document.getElementById("Input").value
  kgbatch_tijdelijk = array
  parseCookie(savetype, array)
 }
 fileReader.readAsText(fileToLoad, "UTF-8")
}

function downloadfunc(datastring) {
 var element = document.createElement('a')
 element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(datastring))
 element.setAttribute('download', "Behoeften.kgvar")
 element.style.display = 'none'
 document.body.appendChild(element)
 element.click()
 document.body.removeChild(element)
}

function geenafbeelding() {
 var afbeelding = afbeelding = "Personages/Arjen.png"
 document.getElementById("afbeelding").innerHTML="<img src='" + afbeelding + "' style='max-width:100%'>"
}

function weergaveveranderen(stand) {
if (stand) {
 document.getElementById("resultaten_los").style.display="none"
 document.getElementById("resultaten_string").style.display="inline-block"
 document.getElementById("versieopslaan_div").style.display="none"
 document.getElementById("weergave_los").checked = false
 document.getElementById("weergave_string").checked = true
}
else {
 document.getElementById("resultaten_los").style.display="inline-block"
 document.getElementById("resultaten_string").style.display="none"
 document.getElementById("versieopslaan_div").style.display="inline-block"
 document.getElementById("weergave_los").checked = true
 document.getElementById("weergave_string").checked = false
}
}

function weergaveveranderen_opslagversie() {
var stand = document.getElementById("versieopslaan").value
document.getElementById("spelspecifiekesaveversie").value = stand
}

function weergaveveranderen_opslagplek() {
var stand = document.getElementById("Output").value
if (stand.indexOf("kgl_speldata") !== -1) {
 document.getElementById("versieopslaan").value = "KGL213"
}
else if (stand.indexOf("kgb_speldata") !== -1) {
 document.getElementById("versieopslaan").value = "KGB110"
}
else {
 document.getElementById("versieopslaan").value = "KGO213"
}
weergaveveranderen_opslagversie()
}

var kgbatch_tijdelijk = "leeg"
